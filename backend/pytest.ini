[pytest]
# Pytest configuration for Files feature tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Markers
markers =
    integration: Integration tests (may require DB, external services)
    slow: Slow tests (> 1 second)
    gdrive: Tests requiring Google Drive setup
    requires_db: Tests requiring database connection
    requires_api: Tests requiring running API server
    manual: Manual tests (run explicitly with test files)

# Coverage options (when using pytest-cov)
[coverage:run]
source = domains.files
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
