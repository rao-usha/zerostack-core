# ZeroStack Platform - Development Docker Compose
# Usage: docker compose -p zerostack up -d
#
# Fast build (default, no ML/PyTorch):
#   docker compose -p zerostack up -d
#
# With ML/synthetic data support:
#   BACKEND_REQUIREMENTS=ml docker compose -p zerostack up -d --build
#
# Services:
#   - db: PostgreSQL with pgvector
#   - minio: S3-compatible object storage
#   - backend: FastAPI backend with hot reload
#   - frontend: React frontend with Vite dev server

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: nex-db
    environment:
      POSTGRES_USER: nex
      POSTGRES_PASSWORD: nex
      POSTGRES_DB: nex
    ports:
      - "5432:5432"
    volumes:
      - nex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nex -d nex"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nex-network

  # ========================================
  # MinIO Object Storage (S3-compatible)
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: nex-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - nex_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nex-network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: nex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/nex-data --ignore-existing;
      mc anonymous set download myminio/nex-data/public;
      echo '✅ MinIO bucket nex-data ready';
      exit 0;
      "
    networks:
      - nex-network

  # ========================================
  # Backend API (FastAPI)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Options: core (fast, no ML), ml (with PyTorch/SDV), full (everything)
        REQUIREMENTS: ${BACKEND_REQUIREMENTS:-core}
    container_name: nex-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://nex:nex@db:5432/nex
      - SECRET_KEY=dev-secret-key
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Data Explorer databases
      - EXPLORER_DB_HOST=${EXPLORER_DB_HOST:-db}
      - EXPLORER_DB_PORT=${EXPLORER_DB_PORT:-5432}
      - EXPLORER_DB_USER=${EXPLORER_DB_USER:-nex}
      - EXPLORER_DB_PASSWORD=${EXPLORER_DB_PASSWORD:-nex}
      - EXPLORER_DB_NAME=${EXPLORER_DB_NAME:-nex}
      - EXPLORER2_DB_HOST=${EXPLORER2_DB_HOST:-}
      - EXPLORER2_DB_PORT=${EXPLORER2_DB_PORT:-}
      - EXPLORER2_DB_USER=${EXPLORER2_DB_USER:-}
      - EXPLORER2_DB_PASSWORD=${EXPLORER2_DB_PASSWORD:-}
      - EXPLORER2_DB_NAME=${EXPLORER2_DB_NAME:-}
      # Object Storage (MinIO/S3)
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=nex-data
      - S3_USE_SSL=false
      # GPU Compute
      - COMPUTE_ADAPTER=${COMPUTE_ADAPTER:-local}
      # SSH Adapter
      - SSH_HOST=${SSH_HOST:-}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_USER=${SSH_USER:-ubuntu}
      - SSH_KEY_PATH=${SSH_KEY_PATH:-}
      - SSH_DOCKER_RUNTIME=${SSH_DOCKER_RUNTIME:-nvidia}
      # RunPod Adapter
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_DEFAULT_GPU=${RUNPOD_DEFAULT_GPU:-NVIDIA RTX A5000}
      - RUNPOD_TEMPLATE_ID=${RUNPOD_TEMPLATE_ID:-}
      - RUNPOD_ENDPOINT_ID=${RUNPOD_ENDPOINT_ID:-}
      - RUNPOD_POD_ID=${RUNPOD_POD_ID:-}
      - RUNPOD_SSH_KEY_PATH=${RUNPOD_SSH_KEY_PATH:-/root/.ssh/id_ed25519}
      # K8s Gateway Adapter
      - K8S_GATEWAY_URL=${K8S_GATEWAY_URL:-}
      - K8S_NAMESPACE=${K8S_NAMESPACE:-nex-compute}
      # GPU Runner Settings
      - GPU_COUNT_DEFAULT=${GPU_COUNT_DEFAULT:-1}
      - RUN_TIMEOUT_SECONDS=${RUN_TIMEOUT_SECONDS:-3600}
      - DERIVED_ASSET_TTL_DAYS=${DERIVED_ASSET_TTL_DAYS:-14}
      - FINALIZER_POLL_INTERVAL_SECONDS=${FINALIZER_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/data_storage:/app/data_storage
      - ${USERPROFILE}/.ssh:/root/.ssh:ro  # Mount SSH keys for RunPod pod access (Windows)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - nex-network

  # ========================================
  # Frontend (React + Vite)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: nex-frontend
    ports:
      - "3000:3000"
    environment:
      # Empty so Vite proxy forwards /api to backend:8000
      - VITE_API_URL=
      - DOCKER_ENV=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nex-network

networks:
  nex-network:
    name: nex-network
    driver: bridge

volumes:
  nex_pgdata:
    name: nex_pgdata
  nex_minio_data:
    name: nex_minio_data
