# NEX Platform - Production Docker Compose
# Usage: docker compose -p nex -f docker-compose.prod.yml up -d
#
# For production deployment with optimized builds and no volume mounts

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: nex-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nex}
      POSTGRES_DB: ${POSTGRES_DB:-nex}
    ports:
      - "5432:5432"
    volumes:
      - nex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nex -d nex"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nex-network
    restart: unless-stopped

  # ========================================
  # MinIO Object Storage
  # ========================================
  minio:
    image: minio/minio:latest
    container_name: nex-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - nex_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nex-network
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: nex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/nex-data --ignore-existing;
      exit 0;
      "
    networks:
      - nex-network

  # ========================================
  # Backend API (Production)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nex-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-nex}:${POSTGRES_PASSWORD:-nex}@db:5432/${POSTGRES_DB:-nex}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Object Storage
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=nex-data
      - S3_USE_SSL=false
      # Compute
      - COMPUTE_ADAPTER=${COMPUTE_ADAPTER:-local}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - nex_data_storage:/app/data_storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - nex-network

  # ========================================
  # Frontend (Production with Nginx)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: nex-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nex-network

networks:
  nex-network:
    name: nex-network
    driver: bridge

volumes:
  nex_pgdata:
    name: nex_pgdata
  nex_minio_data:
    name: nex_minio_data
  nex_data_storage:
    name: nex_data_storage
